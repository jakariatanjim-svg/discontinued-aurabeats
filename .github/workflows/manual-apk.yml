name: "Manual: Android APK"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Manual APK → Overwrite Latest Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Kotlin version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AuraBeats.apk

      - name: Overwrite APK in latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing release found."
            exit 1
          fi
          gh release upload "$LATEST_TAG" AuraBeats.apk --clobber
