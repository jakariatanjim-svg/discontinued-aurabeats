name: "Manual: Windows EXE Portable"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: Manual EXE Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Web App
        run: |
          npm ci
          npm run build

      - name: Prepare Assets
        shell: bash
        run: |
          rm -rf electron/app-bundle
          mkdir -p electron/app-bundle
          cp -r dist/* electron/app-bundle/

      - name: Build EXE
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win portable -c.publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          EXE_FILE="electron/dist-exe/AuraBeats-Portable.exe"
          if [ -f "$EXE_FILE" ]; then
            gh release upload "$LATEST_TAG" "$EXE_FILE" --clobber
          else
            echo "Error: EXE not found"
            exit 1
          fi
