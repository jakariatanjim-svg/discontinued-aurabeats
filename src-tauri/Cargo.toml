[package]
name = "aurabeats"
version = "1.0.0"
description = "AuraBeats Streaming Engine"
authors = ["jakariatanjim-svg"]
edition = "2021"

[lib]
name = "aurabeats_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
