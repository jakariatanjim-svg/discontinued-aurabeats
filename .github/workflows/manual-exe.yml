name: "Manual: Windows EXE Portable (Electron)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: Manual EXE Build → Overwrite Latest Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Electron deps
        working-directory: electron
        run: npm install

      - name: Install electron-builder
        working-directory: electron
        run: npm install --save-dev electron-builder

      - name: Build Portable EXE
        working-directory: electron
        run: |
          npx electron-builder --win portable --dir ../dist
        env:
          NODE_ENV: production

      - name: Collect EXE
        shell: bash
        run: |
          EXE=$(find electron/dist -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            ls -la electron/dist/ || true
            exit 1
          fi
          cp "$EXE" AuraBeats-Portable.exe

      - name: Overwrite EXE in latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing release found."
            exit 1
          fi
          echo "Overwriting EXE in: $LATEST_TAG"
          gh release upload "$LATEST_TAG" AuraBeats-Portable.exe --clobber
