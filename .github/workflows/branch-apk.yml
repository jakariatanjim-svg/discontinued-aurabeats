# Manual test build for any branch.
#
# Dispatch-only on purpose: pushing commits (agent sessions, experiments)
# must not start builds by themselves. To test a branch, open Actions ->
# this workflow -> "Run workflow" and pick the branch in the
# "Use workflow from" dropdown; the run then builds that branch's code.
#
# Artifacts only: this workflow never creates, edits or overwrites a GitHub
# release. Download the APK from the run's Artifacts section and sideload it
# for testing. Because releases are left alone, the in-app APK update check
# (SettingsView -> /releases/latest) is not affected by test builds.
name: "Manual: Branch APK Build (artifact)"

on:
  workflow_dispatch:

# A newer dispatch for the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK (branch test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Set App Icon
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher.png" 2>/dev/null || true
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher_round.png" 2>/dev/null || true
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher_foreground.png" 2>/dev/null || true
          done

      - name: Patch Kotlin stdlib conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AuraBeats.apk

      # Branch names can contain characters that are invalid in artifact names
      # (slash, colon, ...), so derive a safe label first.
      - name: Prepare artifact label
        id: label
        run: |
          SAFE_REF=$(echo "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}
          path: AuraBeats.apk
          if-no-files-found: error
          retention-days: 7
