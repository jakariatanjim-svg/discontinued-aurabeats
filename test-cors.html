<!DOCTYPE html>
<html>
<body>
<script>
async function test() {
  try {
    const url = 'https://corsproxy.io/?' + encodeURIComponent('https://discoveryprovider.audius.co/v1/tracks/YlRbOJ/stream?app_name=AuraBeats');

  }
}
test();
</script>
