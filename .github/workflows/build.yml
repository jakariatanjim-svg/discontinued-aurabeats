name: "Auto: Web Build & Release"

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  web:
    name: Build Web & Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate tag
        id: ver
        run: echo "version=$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Package
        run: |
          cp dist/index.html aurabeats-app.html
          cd dist && zip -r ../aurabeats-web.zip . && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "AuraBeats — ${{ steps.ver.outputs.version }}"
          body: "Auto build · ${{ github.sha }}"
          files: |
            aurabeats-app.html
            aurabeats-web.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
