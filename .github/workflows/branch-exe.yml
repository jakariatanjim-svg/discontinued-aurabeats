# Test build for any non-default branch.
#
# Triggers on every push to any branch except main/master, so new agent/session
# branches are picked up automatically without hardcoding a branch name.
#
# Artifacts only: this workflow never creates, edits or overwrites a GitHub
# release. Download the EXE from the run's Artifacts section and test it
# locally. Because releases are left alone, the in-app updater
# (electron/main.js -> /releases/latest) is not affected by test builds.
name: "Branch: Windows EXE (artifact)"

on:
  push:
    branches-ignore: [main, master]
    # Without this, branches-ignore alone still lets tag pushes trigger a run.
    tags-ignore: ["**"]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exe:
    name: Build Portable EXE (branch test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Web App
        run: |
          npm ci
          npm run build

      - name: Prepare Assets
        shell: bash
        run: |
          rm -rf electron/app-bundle
          mkdir -p electron/app-bundle
          cp -r dist/* electron/app-bundle/

      - name: Build EXE
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win portable --publish never

      # Branch names can contain characters that are invalid in artifact names
      # (slash, colon, ...), so derive a safe label first.
      - name: Prepare artifact label
        shell: bash
        id: label
        run: |
          SAFE_REF=$(echo "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}
          path: electron/dist-exe/AuraBeats-Portable.exe
          if-no-files-found: error
          retention-days: 7
