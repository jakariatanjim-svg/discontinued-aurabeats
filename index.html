<!doctype html>
<html lang="en" data-theme="glassy" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06030f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#7c5cff" media="(prefers-color-scheme: light)" />
    <!-- Critical CSS: paints background + skeleton instantly before JS -->
    <style>
      *,::before,::after{box-sizing:border-box}
      html,body,#root{height:100%;margin:0}
      body{
        background-color:#03010a;
        background-image:radial-gradient(circle at 15% 30%,rgba(59,130,246,.18) 0%,transparent 45%),
          radial-gradient(circle at 85% 70%,rgba(34,211,238,.14) 0%,transparent 50%),
          radial-gradient(circle at 50% 100%,rgba(255,0,128,.09) 0%,transparent 60%);
        font-family:Outfit,system-ui,-apple-system,sans-serif;
        overflow:hidden;
        color:#f8f5ff;
        -webkit-font-smoothing:antialiased;
      }
      #root{display:flex;align-items:center;justify-content:center}
      #app-loading{
        display:flex;flex-direction:column;align-items:center;gap:20px;
        position:fixed;inset:0;background:inherit;
        z-index:999;align-items:center;justify-content:center;
        transition:opacity .3s ease;
      }
      .app-logo{
        width:56px;height:56px;border-radius:16px;
        background:linear-gradient(135deg,#3b82f6,#22d3ee);
        /* same as tab favicon */
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 30px rgba(59,130,246,.5);
        animation:pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      .app-loading-text{font-size:13px;font-weight:600;opacity:.45;letter-spacing:.12em;text-transform:uppercase}
    </style>
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Unlimited music and live radio. No sign-up. No ads. Just play."
    />
    <link rel="canonical" href="https://aurabeats.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurabeats.pages.dev/" />
    <meta property="og:title" content="AuraBeats" />
    <meta property="og:description" content="Unlimited music and live radio. No sign-up. No ads." />
    <meta property="og:image" content="https://aurabeats.pages.dev/og-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuraBeats" />
    <meta name="twitter:description" content="Unlimited music and live radio. No sign-up. No ads." />
    <meta name="twitter:image" content="https://aurabeats.pages.dev/og-card.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["WebSite", "WebApplication"],
        "name": "AuraBeats",
        "url": "https://aurabeats.pages.dev/",
        "description": "Stream millions of songs and live radio in a sleek browser player — no sign-up required.",
        "applicationCategory": "MusicApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <title>AuraBeats</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA Install — mobile (Android + iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuraBeats" />
    <meta name="application-name" content="AuraBeats" />
    <meta name="msapplication-TileImage" content="/icon-512.png" />
    <meta name="msapplication-TileColor" content="#06030f" />
    <!-- Multiple Apple touch icon sizes for better iOS compatibility -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-512.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    <!-- DNS prefetch & preconnect — fastest possible connection setup -->
    <!-- Primary music APIs (preconnect = DNS + TCP + TLS upfront) -->
    <link rel="preconnect" href="https://saavn.sumit.co" crossorigin />
    <link rel="preconnect" href="https://api.jamendo.com" crossorigin />
    <link rel="preconnect" href="https://archive.org" crossorigin />
    <link rel="preconnect" href="https://discoveryprovider.audius.co" crossorigin />
    <!-- Secondary mirrors (dns-prefetch only — lighter, covers fallbacks) -->
    <link rel="dns-prefetch" href="https://discoveryprovider2.audius.co" />
    <link rel="dns-prefetch" href="https://discoveryprovider3.audius.co" />
    <link rel="dns-prefetch" href="https://api.audius.co" />
    <link rel="dns-prefetch" href="https://jiosaavn-api-liart-three.vercel.app" />
    <link rel="dns-prefetch" href="https://jiosaavn-api-sumit.vercel.app" />
    <link rel="dns-prefetch" href="https://pipedapi.kavin.rocks" />
    <link rel="dns-prefetch" href="https://de1.api.radio-browser.info" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Favicon: blue-to-cyan waveform logo — same on tab, PWA, homescreen -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="app-loading" aria-hidden="true">
      <div class="app-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="4" y="11" width="3.2" height="8" rx="1.6" fill="white"/><rect x="9.5" y="6" width="3.2" height="16" rx="1.6" fill="white"/><rect x="15" y="6" width="3.2" height="16" rx="1.6" fill="white"/><rect x="20.5" y="11" width="3.2" height="8" rx="1.6" fill="white"/></svg>
      </div>
      <span class="app-loading-text">AuraBeats</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
