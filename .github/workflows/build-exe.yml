name: "Auto: Windows EXE Portable"

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  exe:
    name: Build Portable EXE & Upload to Latest Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Electron deps
        working-directory: electron
        run: npm install

      - name: Build Portable EXE
        working-directory: electron
        run: npx electron-builder --win portable

      - name: Collect EXE
        shell: bash
        run: |
          EXE=$(find electron/output -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "EXE not found!"
            find electron/ -name "*.exe" || true
            ls -la electron/output/ || true
            exit 1
          fi
          cp "$EXE" AuraBeats-Portable.exe

      - name: Upload EXE to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing release found, skipping."
            exit 0
          fi
          gh release upload "$LATEST_TAG" AuraBeats-Portable.exe --clobber
