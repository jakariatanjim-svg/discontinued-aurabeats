name: Manual Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional, e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          PKG_VER=$(node -p "try{require('./package.json').version}catch(e){''}")

          if [[ -n "$INPUT_VER" ]]; then
            VER="$INPUT_VER"
          elif [[ "$PKG_VER" != "0.0.0" ]] && [[ -n "$PKG_VER" ]]; then
            VER="v${PKG_VER}"
          else
            VER="manual-${{ github.run_id }}"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Prepare release files
        run: |
          cp dist/index.html "index.html"
          cd dist
          zip -r "../aurabeats-dist.zip" .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "AuraBeats ${{ steps.ver.outputs.version }}"
          body: "Manual build - ${{ steps.ver.outputs.Built }}"
          files: |
            index.html
            aurabeats-dist.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}