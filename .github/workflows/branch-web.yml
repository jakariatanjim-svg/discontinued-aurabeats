# Manual test build for the active working branch.
#
# Dispatch-only on purpose: pushing commits (agent sessions, experiments)
# must not start builds by themselves. Just press "Run workflow" - there is
# nothing to pick. The first job resolves the newest branch other than
# main/master (in practice the branch the current Arena session works on)
# and the rest of the job builds exactly that branch's code.
#
# Artifacts only: this workflow never creates, edits or overwrites a GitHub
# release. The production release pipelines (build*.yml, manual-*.yml) stay
# untouched and remain the only thing that writes to releases.
name: "Manual: Branch Web Build (artifact)"

on:
  workflow_dispatch:

# A newer dispatch while an older run is still going cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Build Web (branch test)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve newest non-default branch
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEST=""; BEST_DATE=""; BEST_SHA=""
          for b in $(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'); do
            if [ "$b" = "main" ] || [ "$b" = "master" ]; then continue; fi
            line=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$b&per_page=1" --jq '.[0] | .commit.committer.date + " " + .sha')
            d=${line% *}; s=${line#* }
            if [ -z "$BEST" ] || [[ "$d" > "$BEST_DATE" ]]; then
              BEST="$b"; BEST_DATE="$d"; BEST_SHA="$s"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No branch other than main/master exists to build."
            exit 1
          fi
          echo "branch=$BEST" >> "$GITHUB_OUTPUT"
          echo "sha=$BEST_SHA" >> "$GITHUB_OUTPUT"
          echo "Target branch: $BEST @ ${BEST_SHA:0:7}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Package
        run: |
          cp dist/index.html aurabeats-app.html
          cd dist && zip -r ../aurabeats-web.zip . && cd ..

      # Branch names can contain characters that are invalid in artifact names
      # (slash, colon, ...), so derive a safe label first.
      - name: Prepare artifact label
        id: label
        run: |
          SAFE_REF=$(echo "${{ steps.target.outputs.branch }}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          SHA="${{ steps.target.outputs.sha }}"
          echo "ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}
          path: |
            aurabeats-app.html
            aurabeats-web.zip
          if-no-files-found: error
          retention-days: 7
