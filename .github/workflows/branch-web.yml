# Test build for any non-default branch.
#
# Triggers on every push to any branch except main/master, so new agent/session
# branches are picked up automatically without hardcoding a branch name.
#
# Artifacts only: this workflow never creates, edits or overwrites a GitHub
# release. The production release pipelines (build*.yml, manual-*.yml) stay
# untouched and remain the only thing that writes to releases.
name: "Branch: Web Build (artifact)"

on:
  push:
    branches-ignore: [main, master]
    # Without this, branches-ignore alone still lets tag pushes trigger a run.
    tags-ignore: ["**"]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Build Web (branch test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Package
        run: |
          cp dist/index.html aurabeats-app.html
          cd dist && zip -r ../aurabeats-web.zip . && cd ..

      # Branch names can contain characters that are invalid in artifact names
      # (slash, colon, ...), so derive a safe label first.
      - name: Prepare artifact label
        id: label
        run: |
          SAFE_REF=$(echo "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}
          path: |
            aurabeats-app.html
            aurabeats-web.zip
          if-no-files-found: error
          retention-days: 7
